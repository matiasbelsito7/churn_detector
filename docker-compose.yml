services:
  postgres:
    image: postgres:16
    container_name: churn_postgres
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn
      POSTGRES_DB: churn
    ports:
      - "5432:5432"
    volumes:
      - churn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    container_name: churn_api
    ports:
      - "8000:8000"
    environment:
      MODEL_FILE: /app/data/models/churn-logistic-regression.joblib
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  churn_pgdata:
